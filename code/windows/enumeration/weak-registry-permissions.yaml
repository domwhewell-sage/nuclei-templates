id: weak-registry-permissions

info:
  name: Weak Registry Permissions
  author: domwhewell-sage
  severity: high
  description: |
    Detects weak windows service registry permissions that could allow non-administrative users to modify or control services, potentially leading to local privilege escalation.
  tags: windows,services,code,windows-audit

self-contained: true

code:
  - pre-condition: |
      IsWindows();
    engine:
      - powershell
      - powershell.exe
    args:
      - -ExecutionPolicy
      - Bypass
    pattern: "*.ps1"
    source: |
      $services = Get-WmiObject win32_service | Select-Object -ExpandProperty Name
      foreach ($service in $services) {
        $sd = (Get-Acl "HKLM:\SYSTEM\CurrentControlSet\Services\$service").Access
        foreach ($entry in $sd) {
          if ($entry.RegistryRights -match "Write|FullControl|Modify" -and $entry.IdentityReference -match "Users") {
            Write-Output "$service : $($entry.IdentityReference) : $($entry.RegistryRights)"
          }
        }
      }

    extractors:
      - type: regex
        regex:
          - ".+ : .+"